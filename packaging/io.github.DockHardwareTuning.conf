<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.DockHardwareTuning"/>
  </policy>
  <policy context="default">
    <deny send_destination="io.github.DockHardwareTuning"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="io.github.DockHardwareTuning"
           send_interface="io.github.DockHardwareTuning" send_member="Apply"/>
  </policy>
</busconfig>
