name: Build UOS 20 Debian package

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build UOS 20 compatible toolchain
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ci
          load: true
          tags: dock-hardware-tuning-plugin-builder:latest
          cache-from: type=gha,scope=uos20-dtk-amd64
          cache-to: type=gha,mode=max,scope=uos20-dtk-amd64
      - name: Build and validate package
        id: package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -v "$GITHUB_WORKSPACE:/project" \
            dock-hardware-tuning-plugin-builder ./ci/build-deb.sh
          version=$(dpkg-parsechangelog --show-field Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload package and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dock-hardware-tuning-plugin-amd64-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  publish-release-assets:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: package-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ needs.package-amd64.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_VERSION: ${{ needs.package-amd64.outputs.version }}
      RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
      TAG_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dock-hardware-tuning-plugin-amd64-${{ github.sha }}
          path: dist
      - name: Publish cloud-built Debian package
        shell: bash
        run: |
          tag="${RELEASE_EVENT_TAG:-$PACKAGE_VERSION}"
          if [[ "$TAG_PUSH" == 'true' ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v?[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "Skip publication for non-version tag $tag."
              exit 0
            fi
          elif [[ -z "$RELEASE_EVENT_TAG" ]] && ! git show-ref --verify --quiet "refs/tags/$tag"; then
            tag="v$PACKAGE_VERSION"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "No release tag for $PACKAGE_VERSION yet."
              exit 0
            fi
          fi
          if [[ "${tag#v}" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag $tag does not match package version $PACKAGE_VERSION."
            exit 1
          fi
          # A later workflow-only change can fill in assets for an existing tag.
          if ! git diff --quiet "refs/tags/$tag" HEAD -- . ':(exclude).github/workflows/build-deb.yml'; then
            if [[ -n "$RELEASE_EVENT_TAG" || "$TAG_PUSH" == 'true' ]]; then
              echo "::error::The built sources do not match the release tag $tag."
              exit 1
            fi
            echo "Source differs from $tag; wait for a new version and release."
            exit 0
          fi
          package="dock-hardware-tuning-plugin_${PACKAGE_VERSION}_amd64.deb"
          checksum="$package.sha256"
          (cd dist && sha256sum -c "$checksum")
          if ! release=$(gh release view "$tag" --json isDraft,assets 2>release-error.log); then
            if ! grep -qi 'release not found' release-error.log; then
              cat release-error.log >&2
              exit 1
            fi
            if [[ "$TAG_PUSH" == 'true' ]]; then
              gh release create "$tag" "dist/$package" "dist/$checksum" --verify-tag --generate-notes
            elif [[ -n "$RELEASE_EVENT_TAG" ]]; then
              cat release-error.log >&2
              exit 1
            fi
            exit 0
          fi
          if jq -e '.isDraft' <<< "$release" >/dev/null; then
            echo "Release $tag is still a draft."
            exit 0
          fi
          cd dist
          count=$(jq --arg package "$package" --arg checksum "$checksum" '[.assets[] | select(.name == $package or .name == $checksum)] | length' <<< "$release")
          if [[ "$count" == 2 ]]; then
            echo "Both assets are already attached to $tag."
          elif [[ "$count" == 0 ]]; then
            gh release upload "$tag" "$package" "$checksum"
          else
            echo "::error::Release $tag contains only one of the two expected assets. Check the existing asset before adding its counterpart."
            exit 1
          fi
