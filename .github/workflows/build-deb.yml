name: Build UOS 20 Debian package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build UOS 20 compatible toolchain
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./ci
          load: true
          tags: dock-hardware-tuning-plugin-builder:latest
          cache-from: type=gha,scope=uos20-dtk-amd64
          cache-to: type=gha,mode=max,scope=uos20-dtk-amd64
      - name: Build and validate package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -v "$GITHUB_WORKSPACE:/project" \
            dock-hardware-tuning-plugin-builder ./ci/build-deb.sh
      - name: Upload package and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dock-hardware-tuning-plugin-amd64-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
